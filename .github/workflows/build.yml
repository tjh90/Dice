name: Maven CI build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-package: jdk+fx
        java-version: '25'
        cache: maven

    - name: Build with Maven
      run: mvn -ntp install

    - name: Report test results
      uses: dorny/test-reporter@v3
      with:
        name: JUnit test results
        path: '**/TEST-*.xml'
        reporter: java-junit
